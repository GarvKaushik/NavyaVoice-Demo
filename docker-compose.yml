version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL with pgvector for Indian Data Residency
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: voiceagent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: voiceagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis for DND Caching, Single-Call Locks & CPS Pacing
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: voiceagent-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Local Standalone LiveKit Server (SFU)
  # ----------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:latest
    container_name: voiceagent-livekit
    command: --dev
    ports:
      - "7880:7880"   # HTTP / WebSocket signaling
      - "7881:7881"   # TCP fallback
      - "7882:7882/udp" # UDP media
    environment:
      LIVEKIT_KEYS: "devkey: secret"

  # ----------------------------------------------------------------------------
  # FastAPI Campaign & Telephony Control Plane
  # ----------------------------------------------------------------------------
  campaign-api:
    build: .
    container_name: voiceagent-api
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/voiceagent
      - REDIS_URL=redis://redis:6379/0
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "campaign.api:app", "--host", "0.0.0.0", "--port", "8000"]

  # ----------------------------------------------------------------------------
  # Dialer, CRM webhooks, post-call summaries and recording retention
  # ----------------------------------------------------------------------------
  background:
    build: .
    container_name: voiceagent-background
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/voiceagent
      - REDIS_URL=redis://redis:6379/0
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "campaign.background"]

  # ----------------------------------------------------------------------------
  # LiveKit Agents Worker (Scale horizontally as needed)
  # ----------------------------------------------------------------------------
  agent-worker:
    build: .
    container_name: voiceagent-worker
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/voiceagent
      - REDIS_URL=redis://redis:6379/0
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    command: ["python", "-m", "agent.worker", "start"]

volumes:
  postgres_data:
  redis_data:

