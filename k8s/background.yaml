apiVersion: apps/v1
kind: Deployment
metadata:
  name: background
  namespace: voice-agent
  labels:
    app: background
spec:
  replicas: 1
  selector:
    matchLabels:
      app: background
  template:
    metadata:
      labels:
        app: background
    spec:
      containers:
      - name: background
        image: registry.mumbai.internal/voiceagent-api:v1.0.0
        command: ["python", "-m", "campaign.background"]
        envFrom:
        - secretRef:
            name: voice-agent-secrets
        - configMapRef:
            name: voice-agent-config
