apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-sip
  namespace: voice-agent
  labels:
    app: livekit-sip
spec:
  replicas: 2
  selector:
    matchLabels:
      app: livekit-sip
  template:
    metadata:
      labels:
        app: livekit-sip
    spec:
      containers:
      - name: livekit-sip
        image: livekit/sip:latest
        ports:
        - containerPort: 5060
          protocol: UDP
          name: sip-udp
        - containerPort: 5060
          protocol: TCP
          name: sip-tcp
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
        env:
        - name: SIP_CONFIG
          value: |
            api_key: ${LIVEKIT_API_KEY}
            api_secret: ${LIVEKIT_API_SECRET}
            ws_url: ws://livekit-server:7880
            sip_port: 5060
            rtp_port_range_start: 10000
            rtp_port_range_end: 20000
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-sip-lb
  namespace: voice-agent
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
spec:
  type: LoadBalancer
  selector:
    app: livekit-sip
  ports:
  - port: 5060
    protocol: UDP
    name: sip-udp
  - port: 5060
    protocol: TCP
    name: sip-tcp

